name: V3K backend CI

# Runs on every push/PR to main — catches syntax errors, bad requirements, and
# import failures BEFORE Render tries to deploy them.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (compile all Python)
        run: |
          python -m py_compile app.py
          echo "✅ app.py compiles"

      - name: Validate requirements.txt installs
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "✅ requirements install cleanly"

      - name: Import smoke test (app loads without crashing)
        env:
          # dummy envs so module-level code that reads them doesn't error
          TELEGRAM_TOKEN: "0000000000:CI_DUMMY_TOKEN_FOR_IMPORT_ONLY"
          SECRET_KEY: "ci-dummy-secret"
        run: |
          python - <<'PY'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location("app", "app.py")
          mod = importlib.util.module_from_spec(spec)
          try:
              spec.loader.exec_module(mod)
              assert hasattr(mod, "app"), "Flask app object not found"
              print("✅ app imports and exposes `app`")
          except SystemExit:
              print("✅ app imported (module called sys.exit — ok in CI)")
          except Exception as e:
              print("❌ import failed:", e); sys.exit(1)
          PY
